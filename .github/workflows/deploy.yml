name: Deploy Example Agent

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - get-credentials
          - all
        default: all

jobs:
  deploy-example-agent:
    name: Deploy Example Agent VS
    runs-on: ubuntu-latest
    environment: TEST
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::This workflow can only run on the main branch (current: ${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "NETWORK=testnet" >> "$GITHUB_ENV"

      - name: Load configuration
        run: |
          set -a
          source config.env
          set +a
          while IFS= read -r line; do
            key="${line%%=*}"
            echo "${key}=${!key}" >> "$GITHUB_ENV"
          done < <(grep -E '^[A-Z_]+=' config.env)

      - name: Parse deployment.yaml
        run: |
          CHART_SOURCE=$(yq '.chartSource' deployment.yaml)
          CHART_VERSION=$(yq '.chartVersion' deployment.yaml)
          CHART_NAMESPACE="${{ secrets.K8S_NAMESPACE }}"
          RELEASE_NAME=$(yq '.nameOverride' deployment.yaml)
          echo "CHART_SOURCE=${CHART_SOURCE}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${CHART_VERSION}" >> "$GITHUB_ENV"
          echo "CHART_NAMESPACE=${CHART_NAMESPACE}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"

      - name: Set up kubeconfig
        run: |
          if [ -z "${{ secrets.OVH_KUBECONFIG }}" ]; then
            echo "::error::OVH_KUBECONFIG secret is not set. Please add it to your GitHub Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.K8S_NAMESPACE }}" ]; then
            echo "::error::K8S_NAMESPACE secret is not set. Please add it to your GitHub Secrets."
            exit 1
          fi
          mkdir -p ~/.kube
          cat <<'KUBEEOF' > ~/.kube/config
          ${{ secrets.OVH_KUBECONFIG }}
          KUBEEOF
          chmod 600 ~/.kube/config
          # Verify connection to your namespace
          kubectl get pods -n "${{ secrets.K8S_NAMESPACE }}" || { echo "::error::Could not connect to cluster or namespace is not accessible."; exit 1; }

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.9"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      # -----------------------------------------------------------------------
      # DEPLOY: Install/upgrade via Helm (hologram-generic-ai-agent-chart)
      # -----------------------------------------------------------------------

      # Determine the ONE password to use everywhere
      - name: Resolve Postgres password
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          # Priority: GitHub secret > existing cluster secret > fallback
          PW="${{ secrets.EXAMPLE_AGENT_POSTGRES_PASSWORD }}"

          if [ -z "$PW" ]; then
            echo "::warning::GitHub secret EXAMPLE_AGENT_POSTGRES_PASSWORD is empty"
            # Try to read from cluster
            for SEC in "${RELEASE_NAME}-postgres" "${RELEASE_NAME}-postgresql" "example-agent-db-secret"; do
              for KEY in POSTGRES_PASSWORD postgres-password password; do
                VAL=$(kubectl get secret -n "$CHART_NAMESPACE" "$SEC" -o jsonpath="{.data.$KEY}" 2>/dev/null | base64 -d 2>/dev/null || true)
                if [ -n "$VAL" ]; then
                  PW="$VAL"
                  echo "Found password in cluster secret '$SEC' key '$KEY'"
                  break 2
                fi
              done
            done
          fi

          if [ -z "$PW" ]; then
            PW="placeholder"
            echo "::warning::No password found anywhere — using 'placeholder'"
          fi

          # Show all secrets for debugging


          # Persist for subsequent steps
          echo "RESOLVED_PG_PASSWORD=${PW}" >> "$GITHUB_ENV"

      # Reset password INSIDE the running PostgreSQL pod so it matches
      - name: Sync Postgres password in running DB
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          PG_POD="${RELEASE_NAME}-postgres-0"
          PW="$RESOLVED_PG_PASSWORD"

          echo "Checking if postgres pod $PG_POD is running..."
          if kubectl get pod -n "$CHART_NAMESPACE" "$PG_POD" --no-headers 2>/dev/null | grep -q Running; then
            echo "Resetting password for user '$POSTGRES_USER' inside $PG_POD..."
            kubectl exec -n "$CHART_NAMESPACE" "$PG_POD" -- \
              psql -U postgres -c "ALTER USER \"${POSTGRES_USER}\" WITH PASSWORD '${PW}';" || {
                echo "::warning::Could not reset password via psql (maybe first deploy). Continuing..."
              }
            echo "Password synced successfully inside PostgreSQL."
          else
            echo "Postgres pod not running yet — password will be set on first init."
          fi

      - name: Create K8s secrets
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          NAMESPACE="${CHART_NAMESPACE}"
          PW="$RESOLVED_PG_PASSWORD"

          kubectl create secret generic example-agent-db-secret \
            --namespace "$NAMESPACE" \
            --from-literal=POSTGRES_PASSWORD="$PW" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create agent pack ConfigMap
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          kubectl create configmap example-agent-agent-pack \
            --namespace "$CHART_NAMESPACE" \
            --from-file=agent-pack.yaml=app/agent-packs/example-agent/agent-pack.yaml \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy via Helm
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          # Strip chart metadata before passing to Helm
          yq 'del(.chartSource, .chartVersion)' deployment.yaml > /tmp/helm-values.yaml

          # Inject credential definition ID from config.env
          export CREDENTIAL_DEFINITION_ID
          yq -i '.credentialDefinitionId = env(CREDENTIAL_DEFINITION_ID)' /tmp/helm-values.yaml

          # Validate and/or generate keys
          export MCP_CONFIG_ENCRYPTION_KEY="${{ secrets.EXAMPLE_AGENT_MCP_CONFIG_ENCRYPTION_KEY }}"
          if [ ${#MCP_CONFIG_ENCRYPTION_KEY} -ne 64 ]; then
            export MCP_CONFIG_ENCRYPTION_KEY=$(openssl rand -hex 32)
            echo "::warning::MCP_CONFIG_ENCRYPTION_KEY invalid or missing — using generated key"
          fi
          WALLET_KEY="${{ secrets.EXAMPLE_AGENT_WALLET_KEY }}"
          if [ -z "$WALLET_KEY" ]; then
            WALLET_KEY=$(openssl rand -base64 32)
            echo "::warning::WALLET_KEY missing — using generated key"
          fi

          # Use the resolved password everywhere
          export RELEASE_NAME CHART_NAMESPACE WALLET_KEY
          export OPENAI_API_KEY="${{ secrets.EXAMPLE_AGENT_OPENAI_API_KEY }}"
          export POSTGRES_PASSWORD="$RESOLVED_PG_PASSWORD"



          yq -i '
            .credentialDefinitionId = env(CREDENTIAL_DEFINITION_ID) |
            (.chatbot.env[] | select(.name == "LLM_PROVIDER")).value = env(LLM_PROVIDER) |
            (.chatbot.env[] | select(.name == "OPENAI_MODEL")).value = env(OPENAI_MODEL) |
            (.chatbot.env[] | select(.name == "OPENAI_BASE_URL")).value = env(OPENAI_BASE_URL) |
            (.chatbot.env[] | select(.name == "LOG_LEVEL")).value = env(LOG_LEVEL) |
            (.chatbot.env[] | select(.name == "REDIS_URL")).value = "redis://" + env(RELEASE_NAME) + "-redis." + env(CHART_NAMESPACE) + ":6379" |
            (.chatbot.env[] | select(.name == "VS_AGENT_ADMIN_URL")).value = "http://" + env(RELEASE_NAME) + "-agent." + env(CHART_NAMESPACE) + ":3000" |
            (.chatbot.env[] | select(.name == "POSTGRES_HOST")).value = env(RELEASE_NAME) + "-postgres." + env(CHART_NAMESPACE) |
            .chatbot.secret.OPENAI_API_KEY = env(OPENAI_API_KEY) |
            .chatbot.secret.MCP_CONFIG_ENCRYPTION_KEY = env(MCP_CONFIG_ENCRYPTION_KEY) |
            .chatbot.secret.POSTGRES_PASSWORD = env(POSTGRES_PASSWORD) |
            .postgres.secret.POSTGRES_PASSWORD = env(POSTGRES_PASSWORD) |
            (."vs-agent-chart".extraEnv[] | select(.name == "POSTGRES_HOST")).value = env(RELEASE_NAME) + "-postgres." + env(CHART_NAMESPACE) |
            (."vs-agent-chart".extraEnv[] | select(.name == "DB_HOST")).value = env(RELEASE_NAME) + "-postgres." + env(CHART_NAMESPACE) |
            (."vs-agent-chart".extraEnv[] | select(.name == "REDIS_HOST")).value = env(RELEASE_NAME) + "-redis." + env(CHART_NAMESPACE) |
            (."vs-agent-chart".extraEnv[] | select(.name == "POSTGRES_PASSWORD")).value = env(POSTGRES_PASSWORD) |
            (."vs-agent-chart".extraEnv[] | select(.name == "AGENT_WALLET_KEY")).value = env(WALLET_KEY) |
            ."vs-agent-chart".eventsBaseUrl = "http://" + env(RELEASE_NAME) + "-chatbot." + env(CHART_NAMESPACE) + ":3003"
          ' /tmp/helm-values.yaml

          helm upgrade --install "$RELEASE_NAME" "$CHART_SOURCE" \
            --version "$CHART_VERSION" \
            --namespace "$CHART_NAMESPACE" \
            --values /tmp/helm-values.yaml

      - name: Debug deployed resources
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          echo "=== StatefulSets ==="
          kubectl get statefulsets -n "$CHART_NAMESPACE" -o wide
          echo "=== Services ==="
          kubectl get svc -n "$CHART_NAMESPACE" -o wide
          echo "=== Pods ==="
          kubectl get pods -n "$CHART_NAMESPACE" -o wide
          echo "=== Helm release content ==="
          helm get values "$RELEASE_NAME" -n "$CHART_NAMESPACE" 2>/dev/null | head -50 || echo "Could not get Helm values"

      - name: Restart chatbot and agent
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          # Restart chatbot
          kubectl rollout restart statefulset/${RELEASE_NAME}-chatbot -n "$CHART_NAMESPACE"

          # Find and restart the agent statefulset
          AGENT_STS=$(kubectl get statefulsets -n "$CHART_NAMESPACE" --no-headers -o custom-columns=":metadata.name" | grep -E "^${RELEASE_NAME}.*agent" | head -1)
          if [ -n "$AGENT_STS" ]; then
            echo "Restarting agent statefulset: $AGENT_STS"
            kubectl rollout restart statefulset/"$AGENT_STS" -n "$CHART_NAMESPACE"
          else
            echo "::warning::No agent statefulset found matching '${RELEASE_NAME}.*agent'. Available:"
            kubectl get statefulsets -n "$CHART_NAMESPACE" --no-headers
          fi

          # Wait for chatbot
          if ! kubectl rollout status statefulset/${RELEASE_NAME}-chatbot -n "$CHART_NAMESPACE" --timeout=300s; then
            echo "::error::Chatbot failed to become ready."
            kubectl logs -n "$CHART_NAMESPACE" -l app.kubernetes.io/instance="${RELEASE_NAME}" -c chatbot --tail=50
            exit 1
          fi

          # Wait for agent (if found)
          if [ -n "$AGENT_STS" ]; then
            echo "Waiting for agent statefulset $AGENT_STS..."
            if ! kubectl rollout status statefulset/"$AGENT_STS" -n "$CHART_NAMESPACE" --timeout=300s; then
              echo "::error::Agent failed to become ready. Logs:"
              kubectl logs -n "$CHART_NAMESPACE" "${AGENT_STS}-0" --all-containers --tail=100
              exit 1
            fi
          fi

      # -----------------------------------------------------------------------
      # GET-CREDENTIALS: Obtain Service credential from eafit-challenge organization
      # -----------------------------------------------------------------------
      - name: Port-forward and Wait for VS Agent
        if: inputs.step == 'get-credentials' || inputs.step == 'all'
        run: |
          # Retry loop to wait for the service to exist, start port-forward, and get a response
          echo "Waiting for VS Agent to be ready..."
          for i in {1..5}; do
            # 1. Try to start port-forward if not already running
            if ! pgrep -f "port-forward.*3002:3000" > /dev/null; then
              # Try several possible service names
              SVC_NAME="${RELEASE_NAME}-agent"
              kubectl get svc "$SVC_NAME" -n "$CHART_NAMESPACE" > /dev/null 2>&1 || SVC_NAME="${RELEASE_NAME}-example-agent"
              kubectl get svc "$SVC_NAME" -n "$CHART_NAMESPACE" > /dev/null 2>&1 || SVC_NAME="${RELEASE_NAME}"
              kubectl get svc "$SVC_NAME" -n "$CHART_NAMESPACE" > /dev/null 2>&1 || SVC_NAME="example-agent"
              
              echo "Attempting port-forward to svc/$SVC_NAME..."
              kubectl port-forward -n "$CHART_NAMESPACE" "svc/$SVC_NAME" 3002:3000 > /dev/null 2>&1 &
              echo "Started port-forward attempt to $SVC_NAME..."
            fi

            # 2. Check if the app responds
            if curl -sf http://localhost:3002/v1/agent > /dev/null; then
              echo "VS Agent is ready and responding!"
              echo "CHILD_PF_PID=$(pgrep -f \"port-forward.*svc/$SVC_NAME\")" >> "$GITHUB_ENV"
              exit 0
            fi
            
            echo "Attempt $i/5: VS Agent not ready, sleeping 10s..."
            sleep 10
          done
          echo "::error::VS Agent API failed to respond after 5 minutes. Debugging info follows:"
          kubectl get pods -n "$CHART_NAMESPACE"
          # Find the pod that is NOT Running, prioritizing current release
          # (We strip '-chart' or '-agent' from RELEASE_NAME to find pods more easily)
          STRIPPED_NAME=$(echo "${RELEASE_NAME}" | sed -E 's/-(chart|agent)//g')
          CRASHING_POD=$(kubectl get pods -n "$CHART_NAMESPACE" --no-headers | grep -v "Running" | grep -E "(${RELEASE_NAME}|${STRIPPED_NAME})" | head -n 1 | awk '{print $1}')
          if [ -z "$CRASHING_POD" ]; then
             # Fallback 1: any non-running pod related to chatbot/agent
             CRASHING_POD=$(kubectl get pods -n "$CHART_NAMESPACE" --no-headers | grep -v "Running" | grep -E "(chatbot|agent)" | head -n 1 | awk '{print $1}')
          fi
          if [ -z "$CRASHING_POD" ]; then
             # Fallback 2: any pod related to the release
             CRASHING_POD=$(kubectl get pods -n "$CHART_NAMESPACE" --no-headers -o custom-columns=":metadata.name" | grep -E "${RELEASE_NAME}" | head -n 1)
          fi

          if [ -n "$CRASHING_POD" ]; then
            echo "Logs for pod $CRASHING_POD:"
            kubectl logs "$CRASHING_POD" -n "$CHART_NAMESPACE" --all-containers --tail=100
          else
            echo "Could not identify relevant pod. General logs for instance ${RELEASE_NAME}:"
            kubectl logs -n "$CHART_NAMESPACE" -l app.kubernetes.io/instance="${RELEASE_NAME}" --all-containers --tail=50
          fi
          exit 1

      - name: Verify organization Agent
        if: inputs.step == 'get-credentials' || inputs.step == 'all'
        run: |
          echo "Connecting to organization at ${ORG_VS_ADMIN_URL}..."
          curl -sf "${ORG_VS_ADMIN_URL}/api" > /dev/null || {
            echo "::warning::Organization admin API not reachable at ${ORG_VS_ADMIN_URL}. Attempting port-forward as fallback..."
            kubectl port-forward -n "$CHART_NAMESPACE" "svc/organization" 3000:3000 > /dev/null 2>&1 &
            ORG_PF_PID=$!
            echo "ORG_PF_PID=$ORG_PF_PID" >> "$GITHUB_ENV"
            sleep 5
            curl -sf http://localhost:3000/api > /dev/null || {
              echo "::error::Could not connect to organization-Agent (neither public nor local service)"
              exit 1
            }
          }

      - name: Get Service credential
        if: inputs.step == 'get-credentials' || inputs.step == 'all'
        run: |
          # Use ORG_VS_ADMIN_URL if port-forward didn't happen
          if [ -n "${ORG_PF_PID:-}" ]; then
            ORG_ADMIN_API="http://localhost:3000"
          else
            ORG_ADMIN_API="${ORG_VS_ADMIN_URL}"
          fi
          CHILD_ADMIN_API="http://localhost:3002"
          source common/common.sh
          set_network_vars "$NETWORK"

          CHILD_DID=$(curl -sf "${CHILD_ADMIN_API}/v1/agent" | jq -r '.publicDid')
          echo "Example Agent DID: $CHILD_DID"

          CHILD_PUBLIC_URL="${AGENT_PUBLIC_URL}"
          if has_linked_vp "$CHILD_PUBLIC_URL" "service"; then
            ok "Service credential already linked — skipping"
          else
            SERVICE_VTJSC_OUTPUT=$(discover_ecs_vtjsc "$ECS_TR_PUBLIC_URL" "service")
            SERVICE_JSC_URL=$(echo "$SERVICE_VTJSC_OUTPUT" | sed -n '1p')

            download_logo_data_uri "$SERVICE_LOGO_URL" > /tmp/service_logo_data_uri

            SERVICE_CLAIMS=$(jq -n \
              --rawfile logo /tmp/service_logo_data_uri \
              --arg id "$CHILD_DID" \
              --arg name "$SERVICE_NAME" \
              --arg type "${SERVICE_TYPE:-AIAgent}" \
              --arg desc "$SERVICE_DESCRIPTION" \
              --argjson age "${SERVICE_MIN_AGE:-0}" \
              --arg terms "${SERVICE_TERMS:-}" \
              --arg privacy "${SERVICE_PRIVACY:-}" \
              '{id: $id, name: $name, type: $type, description: $desc, logo: ($logo | rtrimstr("\n")), minimumAgeRequired: $age, termsAndConditions: $terms, privacyPolicy: $privacy}')

            issue_remote_and_link "$ORG_ADMIN_API" "$CHILD_ADMIN_API" "service" "$SERVICE_JSC_URL" "$CHILD_DID" "$SERVICE_CLAIMS"
          fi

      # -----------------------------------------------------------------------
      # CLEANUP
      # -----------------------------------------------------------------------
      - name: Stop port-forwards
        if: always()
        run: |
          [ -n "${CHILD_PF_PID:-}" ] && kill "$CHILD_PF_PID" 2>/dev/null || true
          [ -n "${ORG_PF_PID:-}" ] && kill "$ORG_PF_PID" 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "## Example Agent VS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **VS Agent:** https://example-agent.eafit.testnet.verana.network/.well-known/did.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Network:** testnet" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Chart:** ${CHART_SOURCE:-}:${CHART_VERSION:-}" >> "$GITHUB_STEP_SUMMARY"
